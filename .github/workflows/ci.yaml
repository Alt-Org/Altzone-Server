name: CI

on:
  push:
    branches:
      - prod
      - main
      - dev
      - feature/migrate-ci-gh-actions-871
      - feature/migrate-ci-gh-actions-pr-871

  pull_request:
    branches:
      - prod
      - main
      - develop
      - feature/migrate-ci-gh-actions-pr-871
      - feature/migrate-ci-gh-actions-871

jobs:
  test:
    name: Install & Run Tests
    runs-on: [self-hosted, gh-runner-common]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (first attempt)
        id: first_run
        continue-on-error: true
        run: npm test -- --coverage --json --testPathPatterns=friendship --outputFile=test-results.json

      - name: Identify failed test suites
        if: steps.first_run.outcome == 'failure'
        id: failed_tests
        run: |
          if [ ! -f test-results.json ]; then
            echo "No test results file found, treating as full failure"
            exit 1
          fi
          FAILED_SUITES=$(node -e "
            const results = require('./test-results.json');
            const failed = results.testResults
              .filter(suite => suite.status === 'failed')
              .map(suite => suite.name)
              .join('\n');
            console.log(failed);
          ")
          if [ -z "$FAILED_SUITES" ]; then
            echo "No failed suites identified despite failure exit code"
            exit 1
          fi
          echo "Failed test suites:"
          echo "$FAILED_SUITES"
          echo "$FAILED_SUITES" > failed-suites.txt
      - name: Re-run failed test suites individually
        if: steps.first_run.outcome == 'failure'
        run: |
          OVERALL_EXIT=0
          while IFS= read -r suite; do
            if [ -n "$suite" ]; then
              echo ""
              echo "=== Re-running: $suite ==="
              if ! npx jest "$suite"; then
                echo "Still failing: $suite"
                OVERALL_EXIT=1
              else
                echo "Passed on retry: $suite"
              fi
            fi
          done < failed-suites.txt
          exit $OVERALL_EXIT

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Jenkins had recordCoverage + junit publishing built in.
      # GitHub Actions has no native equivalent — this uploads raw results as
      # artifacts for now. Swap in something like dorny/test-reporter if you
      # want them rendered in the Actions UI / PR checks.
#      - name: Upload test results
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: test-results
#          path: |
#            junit.xml
#            **/cobertura-coverage.xml
#          if-no-files-found: ignore

